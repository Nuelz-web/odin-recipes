<h1>Pancakes</h1>
<img src="https://images.unsplash.com/photo-1528207776546-365bb710ee93"width="300">
<h2>Description</h2>
<p>Fluffy pancakes are perfect for breakfast.</p>
<h3>Ingredients</h3>
<ul>
<li>1 cup all-purpose flour</li>
<li>1 egg</li>
<li>1 cup milk</li>
<li>2 tablespoons sugar</li>
</ul>
<h3>Instructions</h3>
<ol>
<li>Mix the dry ingredients in a bowl.</li>
<li>Add milk and egg</li>
<li>Stir until it's smooth.</li>
<li>Cook on hot pan</li>
</ol>
